<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Standings — hashfootery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a class="header-logo" href="/">
    <img src="hashfootery logo.jpg" alt="hashfootery" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
    <span class="logo-fallback" style="display:none">hash<span>footery</span></span>
  </a>
  <nav>
    <a href="/">Home</a>
    <a href="predict.html">Predict</a>
    <a href="leaderboard.html" class="active">Standings</a>
  </nav>
</header>

<main>
  <h2>Season Standings</h2>
  <div id="lb-container"><p style="color:var(--muted)">Loading…</p></div>
</main>

<script>
const medals = ['🥇','🥈','🥉'];

async function load() {
  const container = document.getElementById('lb-container');
  try {
    const r = await fetch('/api/leaderboard');
    const standings = await r.json();
    if (!standings.length) {
      container.innerHTML = '<p style="color:var(--muted)">No scored predictions yet — check back after the first results are in!</p>';
      return;
    }
    container.innerHTML = `
      <table class="lb-table">
        <thead>
          <tr>
            <th class="num">#</th>
            <th>Player</th>
            <th class="num">Pts</th>
            <th class="num">Exact</th>
            <th class="num">Result</th>
            <th class="num">Played</th>
          </tr>
        </thead>
        <tbody>
          ${standings.map((p, i) => `
            <tr>
              <td class="pos num">${medals[i] || i+1}</td>
              <td><strong>${p.name}</strong></td>
              <td class="num pts">${p.total}</td>
              <td class="num" style="color:var(--green-mid)">${p.exact}</td>
              <td class="num" style="color:var(--muted)">${p.outcome}</td>
              <td class="num" style="color:var(--muted)">${p.played}</td>
            </tr>`).join('')}
        </tbody>
      </table>
      <p style="margin-top:0.75rem;font-size:0.8rem;color:var(--muted)">Pts = total points · Exact = correct scores (3pts each) · Result = correct outcome (1pt each)</p>
    `;
  } catch(e) {
    container.innerHTML = '<p style="color:var(--muted)">Could not load standings.</p>';
  }
}

load();
</script>

</body>
</html>
