<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Standings — hashfootery</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>

<header>
  <a class="header-logo" href="/">
    <img src="hashfootery-ball.png" alt="">
    <span class="logo-text">hashfootery</span>
  </a>
  <nav>
    <a href="/">Home</a>
    <a href="predict.html">Predict</a>
    <a href="season.html">Season</a>
    <a href="leaderboard.html" class="active">Standings</a>
  </nav>
</header>

<main>
  <h2>Season Standings</h2>
  <div id="lb-container"><p style="color:var(--muted)">Loading…</p></div>
</main>

<script>
const medals = ['🥇','🥈','🥉'];

// Fetch Bluesky avatar URL for a handle (returns null on any failure)
async function getBskyAvatar(handle) {
  try {
    const clean = handle.replace(/^@/, '');
    const r = await fetch(`https://public.api.bsky.app/xrpc/app.bsky.actor.getProfile?actor=${encodeURIComponent(clean)}`);
    if (!r.ok) return null;
    const j = await r.json();
    return j.avatar || null;
  } catch(e) { return null; }
}

function initials(name) {
  return name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
}

async function load() {
  const container = document.getElementById('lb-container');
  try {
    const r = await fetch('/api/leaderboard');
    const standings = await r.json();
    if (!standings.length) {
      container.innerHTML = '<p style="color:var(--muted)">No players yet — be the first to sign up!</p>';
      return;
    }

    // Fetch avatars in parallel for players with Bluesky handles
    const avatars = await Promise.all(
      standings.map(p => p.bluesky_handle ? getBskyAvatar(p.bluesky_handle) : Promise.resolve(null))
    );

    container.innerHTML = `
      <table class="lb-table">
        <thead>
          <tr>
            <th class="num">#</th>
            <th>Player</th>
            <th class="num">Total</th>
            <th class="num">Matches</th>
            <th class="num">Season</th>
            <th class="num">Exact</th>
            <th class="num">Played</th>
          </tr>
        </thead>
        <tbody>
          ${standings.map((p, i) => {
            const avatar = avatars[i];
            const pic = avatar
              ? `<img src="${avatar}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:0.5rem">`
              : `<span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--green-pale);color:var(--green);font-size:0.65rem;font-weight:700;vertical-align:middle;margin-right:0.5rem">${initials(p.name)}</span>`;
            return `
            <tr>
              <td class="pos num">${medals[i] || i+1}</td>
              <td>${pic}<strong>${p.name}</strong></td>
              <td class="num pts">${p.total}</td>
              <td class="num" style="color:var(--muted)">${p.match_pts}</td>
              <td class="num" style="color:var(--green-mid)">${p.season_pts || 0}</td>
              <td class="num" style="color:var(--muted)">${p.exact}</td>
              <td class="num" style="color:var(--muted)">${p.played}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      <p style="margin-top:0.75rem;font-size:0.8rem;color:var(--muted)">Total = all points · Matches = score prediction points · Season = bonus prediction points · Exact = correct scores (3pts each)</p>
    `;
  } catch(e) {
    container.innerHTML = '<p style="color:var(--muted)">Could not load standings.</p>';
  }
}

load();
</script>

</body>
</html>
